{% extends "layout.html" %}
{% block content %}
<section class="panel">
  <h1>{{ card.creator_name }}</h1>
  <p><strong>推荐理由：</strong> {{ card.recommendation }}</p>
  <p><strong>代表内容：</strong> {{ card.representative_content }}</p>
  <p><strong>数据摘要：</strong> {{ card.data_highlights }}</p>
  <p><strong>风险提示：</strong> {{ card.risks }}</p>
  <p><strong>建议联系方式：</strong> {{ card.suggested_contact }}</p>
</section>
{% endblock %}
