{% extends "layout.html" %}
{% block content %}
<section class="workspace-header">
  <div>
    <p class="eyebrow">公开达人发现</p>
    <h1>搜索工作台</h1>
  </div>
  <span class="mode-badge">真实公开搜索</span>
</section>

<section class="search-workbench">
  <form method="post" action="/search" class="search-form">
    <div class="search-command">
      <input name="input_text" required aria-label="关键词、品牌需求或种子达人链接" placeholder="输入关键词、品牌需求或种子达人链接">
      <button type="submit" class="primary-button">开始搜索</button>
    </div>

    <div class="platform-grid" aria-label="平台">
      <label class="platform-card">
        <input type="checkbox" name="platforms" value="youtube" checked>
        <span>
          <strong>YouTube</strong>
          <small>site:youtube.com</small>
        </span>
      </label>
      <label class="platform-card">
        <input type="checkbox" name="platforms" value="tiktok" checked>
        <span>
          <strong>TikTok</strong>
          <small>site:tiktok.com</small>
        </span>
      </label>
      <label class="platform-card">
        <input type="checkbox" name="platforms" value="instagram" checked>
        <span>
          <strong>Instagram</strong>
          <small>site:instagram.com</small>
        </span>
      </label>
    </div>

    <div class="form-footer">
      <label class="toggle-row">
        <input type="checkbox" name="use_demo_data" value="yes">
        <span>没有真实结果时允许使用演示数据</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" name="run_inline" value="yes" checked>
        <span>立即运行</span>
      </label>
    </div>
  </form>
</section>

<section class="section-block">
  <div class="section-header">
    <div>
      <p class="eyebrow">最近任务</p>
      <h2>搜索历史</h2>
    </div>
  </div>
  <div class="task-card-grid">
    {% for row in task_rows %}
      {% set task = row.task %}
      <a class="task-card" href="/tasks/{{ task.id }}">
        <span class="status-badge status-{{ task.status }}">{{ row.status_label }}</span>
        <strong>#{{ task.id }} {{ task.input_text }}</strong>
        <span>{{ row.platforms_label }}</span>
      </a>
    {% else %}
      <div class="empty-state compact-empty">暂无搜索任务。</div>
    {% endfor %}
  </div>
</section>
{% endblock %}
